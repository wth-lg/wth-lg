# The 3D contribution calendar for the profile README (profile-3d-contrib/*.svg), redrawn daily from wth-lg's
# contribution calendar (private contributions are counted where the profile shows them). scripts/daily.py then
# draws assets/stats.svg and its phone layout, stats-narrow.svg, from the same calendar, writes its alt text into
# README.md and cuts the images down to the calendar: the tool's radar and language donut see only public work, the
# total leads stats.svg instead, and the colours and motion become wentao.gg's.
name: profile-3d

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Draw the stats and restyle the 3D images
        run: python3 scripts/daily.py profile-3d-contrib/*.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib assets/stats.svg assets/stats-narrow.svg README.md
          if git commit -m "Redraw the 3D contribution calendar and the stats"; then
            git push
          fi
