# The contribution snake for the profile README: drawn from wth-lg's contribution calendar and published to the
# `output` branch (README.md loads it from there), twice a day and on every push to main. Its dots are the 3D
# calendar's blue ramp (scripts/daily.py's RAMPS), its snake wentao.gg's ink or paper.
name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0b0d12&color_dots=#ebedf0,#c7d7fe,#93b4f8,#3b82f6,#1d4ed8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e8e8e2&color_dots=#1b2029,#13284f,#1e3a8a,#2563eb,#60a5fa
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
