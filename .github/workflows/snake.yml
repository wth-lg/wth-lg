# The contribution snake for the profile README: drawn from wth-lg's contribution calendar and published to the
# `output` branch (README.md loads it from there), twice a day and on every push to main.
name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0b0d12&color_dots=#ebedf0,#bfdbfe,#93c5fd,#3b82f6,#1d4ed8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e8e8e2&color_dots=#161b22,#0c2d6b,#1e40af,#2563eb,#60a5fa
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
